const esc=s=>s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function showCursor(){cursor.classList.add('show');clearTimeout(hideTimer);hideTimer=setTimeout(()=>cursor.classList.remove('show'),3000)}
function cursorOn(el){const r=el.getBoundingClientRect();cursor.style.left=Math.max(4,r.left-34)+'px';cursor.style.top=(r.top+9)+'px';showCursor()}
function render(q=''){grid.innerHTML='';const term=q.trim().toLocaleLowerCase('pt-BR');const visible=channels.filter(c=>c.name.toLocaleLowerCase('pt-BR').includes(term));document.querySelector('#count').textContent=`· ${channels.length} canais`;if(!visible.length){grid.innerHTML='<div class="empty">Nenhum canal encontrado.</div>';return}visible.forEach((c,i)=>{const b=document.createElement('button');b.className='card';b.type='button';b.innerHTML=`<div class="logo">${c.logo?`<img src="${c.logo}" alt="Logo de ${esc(c.name)}">`:''}</div><div class="name">${esc(c.name)}</div><div class="live">AO VIVO</div>`;b.onclick=()=>choose(c,b);b.onfocus=()=>{if(!sourceMode)active=b};b.onkeydown=e=>{const a=[...grid.querySelectorAll('.card')],n=a.indexOf(b);if(e.key==='Enter'||e.key===' '){e.preventDefault();choose(c,b)}else if(e.key==='ArrowRight'){e.preventDefault();a[Math.min(n+1,a.length-1)]?.focus()}else if(e.key==='ArrowLeft'){e.preventDefault();a[Math.max(n-1,0)]?.focus()}else if(e.key==='ArrowDown'){e.preventDefault();a[Math.min(n+5,a.length-1)]?.focus()}else if(e.key==='ArrowUp'){e.preventDefault();a[Math.max(n-5,0)]?.focus()}};grid.appendChild(b)});grid.querySelector('.card')?.focus()}
function choose(c,b){active=b;const opts=[];if(c.embed)opts.push('embed');if(c.rede)opts.push('rede');if(opts.length<2){openPlayer(c,opts[0]);return}pending=c;sourceIndex=0;document.querySelector('#sourceTitle').textContent='Escolha a fonte — '+c.name;backdrop.classList.add('open');focusSource()}
function focusSource(){const a=[...document.querySelectorAll('.source-option')].filter(x=>pending&&pending[x.dataset.source]);a.forEach((x,i)=>x.classList.toggle('active',i===sourceIndex));if(a[sourceIndex]){a[sourceIndex].focus();cursorOn(a[sourceIndex])}}
document.querySelectorAll('.source-option').forEach(b=>b.onclick=()=>{if(pending)openPlayer(pending,b.dataset.source);closeSource()});
function closeSource(){backdrop.classList.remove('open');pending=null;sourceMode=false;cursor.classList.remove('show');active?.focus()}
function openPlayer(c,source){const url=source==='embed'?c.embed:c.rede;if(!url)return;player.src=url;overlay.classList.add('open');cursor.style.left='50%';cursor.style.top='50%';showCursor();setTimeout(()=>{try{player.requestFullscreen?.()}catch(_){ }player.focus()},500)}
function closePlayer(){player.src='about:blank';overlay.classList.remove('open');cursor.classList.remove('show');active?.focus()}
search.oninput=()=>render(search.value);search.onkeydown=e=>{if(e.key==='ArrowDown'){e.preventDefault();grid.querySelector('.card')?.focus()}};
document.addEventListener('keydown',e=>{if(backdrop.classList.contains('open')){const a=[...document.querySelectorAll('.source-option')].filter(x=>pending&&pending[x.dataset.source]);if(e.key==='ArrowDown'||e.key==='ArrowRight'){e.preventDefault();sourceIndex=(sourceIndex+1)%a.length;focusSource()}else if(e.key==='ArrowUp'||e.key==='ArrowLeft'){e.preventDefault();sourceIndex=(sourceIndex-1+a.length)%a.length;focusSource()}else if(e.key==='Enter'||e.key===' '){e.preventDefault();a[sourceIndex]?.click()}else if(e.key==='Escape'||e.key==='Backspace'){e.preventDefault();closeSource()}return}if(overlay.classList.contains('open')){if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)){const d={ArrowUp:[0,-42],ArrowDown:[0,42],ArrowLeft:[-42,0],ArrowRight:[42,0]}[e.key];cursor.style.left=(parseFloat(cursor.style.left||'50')+(d[0]/window.innerWidth*100))+'%';cursor.style.top=(parseFloat(cursor.style.top||'50')+(d[1]/window.innerHeight*100))+'%';showCursor()}else if(e.key==='Enter'||e.key===' '||e.key==='MediaPlayPause'){try{player.contentWindow.postMessage({type:'toggle-play'},'*')}catch(_){}showCursor()}else if(e.key==='Escape'||e.key==='Backspace'){e.preventDefault();closePlayer()}return}});
window.addEventListener('message',e=>{if(e.data&&e.data.type==='close-player')closePlayer()});render();
</script></body></html>
