<html lang="pt-BR">
<head>
  <meta charset="UTF-8">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #0d0d0d;
      color: #fff;
      height: 100vh;
      overflow: hidden;
      display: flex;
    }

    /* ===== BARRA LATERAL ===== */
    .sidebar {
      width: 340px;
      background: #1a1a1a;
      display: flex;
      flex-direction: column;
      border-right: 2px solid #333;
      flex-shrink: 0;
    }

    .search-box {
      padding: 12px;
      background: #111;
      border-bottom: 1px solid #333;
    }

    .search-box input {
      width: 100%;
      padding: 14px 16px;
      font-size: 18px;
      border: none;
      border-radius: 6px;
      background: #2a2a2a;
      color: #fff;
      outline: none;
    }

    .search-box input:focus {
      background: #333;
      box-shadow: 0 0 0 2px #e50914;
    }

    .channel-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px 0;
    }

    /* Scrollbar mais visível para TV */
    .channel-list::-webkit-scrollbar {
      width: 10px;
    }
    .channel-list::-webkit-scrollbar-track {
      background: #1a1a1a;
    }
    .channel-list::-webkit-scrollbar-thumb {
      background: #555;
      border-radius: 5px;
    }

    .channel-item {
      padding: 16px 20px;
      font-size: 18px;
      cursor: pointer;
      border-bottom: 1px solid #2a2a2a;
      transition: background 0.15s;
      outline: none;
    }

    .channel-item:hover,
    .channel-item:focus {
      background: #e50914;
      color: #fff;
    }

    .channel-item.active {
      background: #e50914;
      font-weight: bold;
    }

    /* ===== ÁREA DO PLAYER ===== */
    .player-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #000;
      position: relative;
    }

    .player-header {
      height: 50px;
      background: #111;
      display: flex;
      align-items: center;
      padding: 0 20px;
      font-size: 18px;
      border-bottom: 1px solid #333;
      flex-shrink: 0;
    }

    #current-channel {
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .player-container {
      flex: 1;
      position: relative;
      background: #000;
    }

    #player {
      width: 100%;
      height: 100%;
      border: none;
      background: #000;
    }

    .placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #666;
      font-size: 22px;
      gap: 20px;
    }

    .placeholder svg {
      width: 80px;
      height: 80px;
      fill: #444;
    }

    /* ===== FULLSCREEN ===== */
    .fullscreen-btn {
      position: absolute;
      top: 12px;
      right: 12px;
      background: rgba(0,0,0,0.7);
      border: none;
      color: white;
      font-size: 24px;
      width: 48px;
      height: 48px;
      border-radius: 6px;
      cursor: pointer;
      z-index: 10;
      display: none;
    }

    .player-container:hover .fullscreen-btn,
    .player-container:focus-within .fullscreen-btn {
      display: block;
    }

    /* ===== RESPONSIVO / TV BOX ===== */
    @media (max-width: 900px) {
      body {
        flex-direction: column;
      }
      .sidebar {
        width: 100%;
        height: 40vh;
      }
      .player-area {
        height: 60vh;
      }
    }
  </style>
</head>

    const placeholder = document.getElementById('placeholder');
    const currentChannel = document.getElementById('current-channel');
    const searchInput = document.getElementById('search');

    let activeItem = null;

    // Renderiza a lista
    function renderList(filter = '') {
      listEl.innerHTML = '';
      const filtered = channels.filter(c => 
        c.name.toLowerCase().includes(filter.toLowerCase())
      );

      filtered.forEach((ch, index) => {
        const div = document.createElement('div');
        div.className = 'channel-item';
        div.textContent = ch.name;
        div.tabIndex = 0; // permite navegação com controle remoto
        div.dataset.url = ch.url;
        div.dataset.name = ch.name;

        div.addEventListener('click', () => playChannel(div));
        div.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            playChannel(div);
          }
        });

        listEl.appendChild(div);
      });
    }

    // Toca o canal + tenta fullscreen
    function playChannel(item) {
      if (activeItem) activeItem.classList.remove('active');
      item.classList.add('active');
      activeItem = item;

      const url = item.dataset.url;
      const name = item.dataset.name;

      currentChannel.textContent = name;
      placeholder.style.display = 'none';
      player.style.display = 'block';
      player.src = url;

      // Tenta entrar em tela cheia automaticamente
      setTimeout(() => {
        const container = document.getElementById('playerContainer');
        if (container.requestFullscreen) {
          container.requestFullscreen().catch(() => {});
        } else if (container.webkitRequestFullscreen) {
          container.webkitRequestFullscreen();
        }
      }, 800);
    }

    function toggleFullscreen() {
      const container = document.getElementById('playerContainer');
      if (!document.fullscreenElement) {
        if (container.requestFullscreen) container.requestFullscreen();
        else if (container.webkitRequestFullscreen) container.webkitRequestFullscreen();
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
      }
    }

    // Busca
    searchInput.addEventListener('input', (e) => {
      renderList(e.target.value);
    });

    // Navegação com setas (útil em TV Box)
    document.addEventListener('keydown', (e) => {
      const items = [...document.querySelectorAll('.channel-item')];
      const focused = document.activeElement;
      const idx = items.indexOf(focused);

      if (e.key === 'ArrowDown' && idx < items.length - 1) {
        e.preventDefault();
        items[idx + 1].focus();
      }
      if (e.key === 'ArrowUp' && idx > 0) {
        e.preventDefault();
        items[idx - 1].focus();
      }
    });

    // Inicializa
    renderList();
